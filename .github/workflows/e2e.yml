name: E2E
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  id-token: write
  contents: read
concurrency: e2e
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        working-directory: examples/laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
      - run: composer install --no-interaction --no-progress
        working-directory: .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ARCO_E2E_ROLE_ARN }}
          aws-region: us-east-1
      - name: Store APP_KEY
        run: echo "base64:$(openssl rand -base64 32)" | php ../../packages/arco/bin/arco secret:set app-key --env=e2e --no-interaction
      - name: Deploy
        run: php ../../packages/arco/bin/arco deploy --env=e2e --yes --no-interaction
      - name: Check the live endpoint
        run: |
          URL=$(php ../../packages/arco/bin/arco info --env=e2e --json | jq -r .url)
          test "$(curl -s -o /dev/null -w '%{http_code}' --http1.1 "$URL/up")" = 200
          curl -s --http1.1 "$URL/arco-check" | jq -e '.sapi == "frankenphp" and .storage == "/tmp/arco/storage" and .scheme == "https"'
      - name: Remove
        if: always()
        run: php ../../packages/arco/bin/arco remove --env=e2e --force --no-interaction
      - name: Delete the APP_KEY parameter
        if: always()
        run: aws ssm delete-parameter --name /arco-example/e2e/app-key || true
